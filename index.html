<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SkySense cinematic weather intelligence experience." />
  <title>SkySense | Precision Weather</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#030712" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- User's Custom Background Video -->
  <div class="video-container">
    <div class="video-overlay"></div>
    <video autoplay loop muted playsinline class="bg-video">
      <source src="videos/Dark_Cinematic_Weather_Video_Creation.mp4" type="video/mp4">
    </video>
  </div>

  <header class="site-header">
    <div class="brand-wrap">
      <i class="ri-thunderstorms-line"></i>
      <span class="logo-text">SkySense</span>
    </div>
  </header>

  <main class="hero-container">
    <div class="hero-content">
      <p class="eyebrow">Professional Weather Platform</p>
      <h1>
        Feel the storm
        <br/>
        <span class="headline-rotator" aria-live="polite">before it hits</span>
      </h1>

      
      <div class="cta-group">
        <a class="btn btn-primary" href="app/index.html">
          Experience Now <i class="ri-arrow-right-line"></i>
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <a href="https://github.com/AbhayxRajput07" target="_blank" class="author-link">
        <i class="ri-github-fill"></i> Built by Abhay Rajput
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
